name: Check Parliament Bulletins

on:
  schedule:
    # Every 15 min, 02:30-21:45 UTC = 8:00am-3:15am IST.
    # The overnight window catches bulletins uploaded after unusually late sittings;
    # the 8am run also acts as a daily catch-up.
    - cron: "*/15 3-21 * * *"
    - cron: "30,45 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check for new bulletins
        env:
          SLACK_BOT_TOKEN: ${{ secrets.PARLIAMENT_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python check_bulletins.py

      - name: Commit updated state
        run: |
          git config user.name "bulletin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update bulletin state"
          git push
